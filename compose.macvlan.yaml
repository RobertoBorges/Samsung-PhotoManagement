# Gives the container its own LAN IP (reach it at http://<FRAME_LAN_IP>, port 80).
# Edit subnet, gateway, parent interface and IP for your network.
# Use with: docker compose -f compose.yaml -f compose.macvlan.yaml up --build -d
# Needs a wired (eth0) Pi: Wi-Fi adapters usually cannot do macvlan.
services:
  frame:
    ports: !reset []
    environment:
      FRAME_OPEN_LAN: "1"
      FRAME_PORT: "80"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    networks:
      lan:
        ipv4_address: ${FRAME_LAN_IP:-192.168.3.200}

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${FRAME_LAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${FRAME_LAN_SUBNET:-192.168.3.0/24}
          gateway: ${FRAME_LAN_GATEWAY:-192.168.3.1}
