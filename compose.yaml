services:
  frame:
    build: .
    image: frame-control-center:local
    ports:
      - "${FRAME_PUBLISH_HOST:-127.0.0.1}:${FRAME_WEB_PORT:-8766}:8765"
    environment:
      FRAME_TV_HOST: "${FRAME_TV_HOST:-192.168.3.217}"
      FRAME_OPEN_LAN: "${FRAME_OPEN_LAN:-}"
    volumes:
      - frame-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  frame-data:
